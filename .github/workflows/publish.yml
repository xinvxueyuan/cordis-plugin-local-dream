name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 集成冒烟需要真实手机（LAN 或 USB/adb），CI 中跳过；发布前在本地跑
      # npm run test:integration（无设备时会打印 SKIP 并以 0 退出）
      # 发布进入 stage 队列（npm stage publish），人工 2FA 批准后上线

  publish:
    name: Stage for npm (trusted publishing + human 2FA approval)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC：npm 可信发布所需
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package version $PKG"
            exit 1
          fi
      # Staged publishing：CI 无 2FA 把版本放入 stage 队列，维护者用 2FA 批准后才真正上线。
      # 认证走 OIDC 可信发布（permissions.id-token: write），不依赖任何 NPM_TOKEN。
      - name: Stage package (with provenance)
        run: npm stage publish --provenance --access public
